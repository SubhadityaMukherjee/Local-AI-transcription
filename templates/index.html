<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Transcription</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../static/css/styles.css" />
  </head>
  <body>
    <header>
      <h1>AI Transcription</h1>
      <span class="subtitle">// uses whisper.cpp</span>
    </header>

    <div class="layout">
      <!-- ── LEFT PANEL ──────────────────────────────────── -->
      <aside class="panel-left">
        <!-- RECORD -->
        <div class="section">
          <div class="section-label" id="toggle-record">
            <span class="toggle-icon">▾</span>
            Record Audio
          </div>
          <div class="section-body" id="body-record">
            <div class="record-area">
              <button
                class="record-btn"
                id="record-btn"
                title="Click to record"
              >
                <div class="dot"></div>
              </button>
              <div class="timer" id="timer"></div>
              <span class="record-status" id="record-status"
                >Click to start recording</span
              >
              <canvas id="waveform"></canvas>
            </div>
          </div>
        </div>

        <!-- UPLOAD -->
        <div class="section">
          <div class="section-label" id="toggle-upload">
            <span class="toggle-icon">▾</span>
            Upload File
          </div>
          <div class="section-body" id="body-upload">
            <div class="upload-zone" id="upload-zone">
              <input type="file" id="file-input" accept="audio/*,video/*" />
              <div class="upload-icon">⬆</div>
              <div style="font-size: 0.82rem">
                Drop audio or video file here
              </div>
              <div class="upload-hint">mp3, wav, flac, m4a, mp4, mkv, mov…</div>
            </div>
          </div>
        </div>

        <!-- JOBS -->
        <div class="jobs-section-header">
          <div class="jobs-section-label" id="toggle-jobs">
            <span class="toggle-icon">▾</span>
            Jobs
          </div>
        </div>
        <!-- <div class="jobs-list" id="jobs-list"></div> -->
        <div class="jobs-list collapsed" id="jobs-list"></div>
      </aside>

      <!-- ── CENTER PANEL: EDITOR ──────────────────────── -->
      <main class="panel-center">
        <div class="editor-toolbar">
          <button class="btn" id="btn-summarize" disabled>⚡ Summarize</button>
          <button class="btn" id="btn-grammar" disabled>✦ Auto fix text</button>
          <button class="btn btn-ghost" id="btn-copy" disabled>⎘ Copy</button>
          <div class="spacer"></div>
          <span class="char-count" id="char-count"></span>
          <button class="btn btn-primary" id="btn-export" disabled>
            ↓ Export Markdown
          </button>
        </div>

        <div class="editor-area">
          <div class="empty-state" id="empty-state">
            <div class="empty-glyph">◌</div>
            <div class="empty-text">Record audio or upload a file to begin</div>
          </div>

          <textarea
            id="transcript-editor"
            spellcheck="true"
            placeholder="Transcript will appear here…"
          ></textarea>

          <div class="processing-overlay" id="processing-overlay">
            <div class="spinner"></div>
            <div class="processing-label" id="processing-label">
              Processing…
            </div>
            <div class="progress-block">
              <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progress-bar-fill"></div>
              </div>
              <div class="progress-meta">
                <span class="progress-pct" id="progress-pct"></span>
                <span class="progress-elapsed" id="progress-elapsed"></span>
              </div>
              <div class="progress-last-update" id="progress-last-update"></div>
            </div>
          </div>
        </div>
      </main>

      <!-- ── RIGHT PANEL: AI RESULTS ───────────────────── -->
      <aside class="panel-right">
        <div class="panel-right-header">AI Results</div>
        <div class="ai-results-panel" id="ai-results">
          <div class="ai-empty-state" id="ai-empty-state">
            <div class="ai-empty-glyph">✦</div>
            <div class="ai-empty-text">
              Summarize or auto-fix your transcript to see results here
            </div>
          </div>
        </div>
      </aside>
    </div>

    <div id="toast-container"></div>

    <script>
      // ─── State ────────────────────────────────────────────────────────────────────
      let mediaRecorder = null;
      let recordChunks = [];
      let recordStream = null;
      let recordStart = null;
      let timerInterval = null;
      let analyser = null;
      let animFrame = null;
      let activeJobId = null;
      let pollInterval = null;
      let jobStartTime = {};
      let lastUpdateTime = {};
      let lastProgress = {};
      let elapsedInterval = null;

      // ─── DOM ──────────────────────────────────────────────────────────────────────
      const recordBtn = document.getElementById("record-btn");
      const timerEl = document.getElementById("timer");
      const statusEl = document.getElementById("record-status");
      const waveformCanvas = document.getElementById("waveform");
      const ctx2d = waveformCanvas.getContext("2d");
      const fileInput = document.getElementById("file-input");
      const uploadZone = document.getElementById("upload-zone");
      const jobsList = document.getElementById("jobs-list");
      const editor = document.getElementById("transcript-editor");
      const emptyState = document.getElementById("empty-state");
      const processingOverlay = document.getElementById("processing-overlay");
      const processingLabel = document.getElementById("processing-label");
      const btnSummarize = document.getElementById("btn-summarize");
      const btnGrammar = document.getElementById("btn-grammar");
      const btnCopy = document.getElementById("btn-copy");
      const btnExport = document.getElementById("btn-export");
      const charCount = document.getElementById("char-count");
      const aiResultsPanel = document.getElementById("ai-results");
      const aiEmptyState = document.getElementById("ai-empty-state");

      // ─── Collapsible sections ─────────────────────────────────────────────────────
      function initToggle(labelId, bodyId) {
        const label = document.getElementById(labelId);
        const body = document.getElementById(bodyId);
        if (!label || !body) return;
        label.addEventListener("click", () => {
          const collapsed = body.classList.toggle("collapsed");
          label.classList.toggle("collapsed", collapsed);
        });
      }

      initToggle("toggle-record", "body-record");
      initToggle("toggle-upload", "body-upload");

      // Jobs toggle
      document
        .getElementById("toggle-jobs")
        .addEventListener("click", function () {
          const list = document.getElementById("jobs-list");
          const isCollapsed = list.classList.toggle("collapsed");
          this.classList.toggle("collapsed", isCollapsed);
        });

      // ─── Toast ────────────────────────────────────────────────────────────────────
      function toast(msg, type = "info") {
        const t = document.createElement("div");
        t.className = `toast ${type}`;
        t.textContent = msg;
        document.getElementById("toast-container").appendChild(t);
        setTimeout(() => t.remove(), 4000);
      }

      // ─── Recording ────────────────────────────────────────────────────────────────
      recordBtn.addEventListener("click", toggleRecord);

      async function toggleRecord() {
        if (mediaRecorder && mediaRecorder.state === "recording") {
          stopRecording();
        } else {
          await startRecording();
        }
      }

      function getSupportedMimeType() {
        const candidates = [
          "audio/webm;codecs=opus",
          "audio/webm",
          "audio/mp4",
          "audio/ogg;codecs=opus",
          "audio/ogg",
        ];
        for (const t of candidates) {
          if (MediaRecorder.isTypeSupported(t)) return t;
        }
        return "";
      }

      async function startRecording() {
        try {
          recordStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
          });
        } catch (e) {
          toast(`Microphone access denied: ${e.message}`, "error");
          return;
        }
        recordChunks = [];
        const audioCtx = new AudioContext();
        const source = audioCtx.createMediaStreamSource(recordStream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        source.connect(analyser);
        drawWaveform();

        const mimeType = getSupportedMimeType();
        try {
          mediaRecorder = new MediaRecorder(
            recordStream,
            mimeType ? { mimeType } : {},
          );
        } catch (e) {
          toast(`Recording not supported: ${e.message}`, "error");
          return;
        }
        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) recordChunks.push(e.data);
        };
        mediaRecorder.onstop = submitRecording;
        mediaRecorder.onerror = (e) =>
          toast(`Recording error: ${e.error?.message || e}`, "error");
        mediaRecorder.start(250);

        recordStart = Date.now();
        timerInterval = setInterval(updateTimer, 500);
        recordBtn.classList.add("recording");
        statusEl.textContent = "Recording… click to stop";
        statusEl.classList.add("active");
      }

      function stopRecording() {
        if (mediaRecorder && mediaRecorder.state !== "inactive")
          mediaRecorder.stop();
        if (recordStream) recordStream.getTracks().forEach((t) => t.stop());
        clearInterval(timerInterval);
        cancelAnimationFrame(animFrame);
        recordBtn.classList.remove("recording");
        statusEl.textContent = "Uploading…";
        statusEl.classList.remove("active");
        timerEl.textContent = "";
        ctx2d.clearRect(0, 0, waveformCanvas.width, waveformCanvas.height);
      }

      async function submitRecording() {
        const mimeType = mediaRecorder?.mimeType || "audio/webm";
        const ext = mimeType.includes("mp4")
          ? "mp4"
          : mimeType.includes("ogg")
            ? "ogg"
            : "webm";
        const blob = new Blob(recordChunks, { type: mimeType });
        if (blob.size < 1000) {
          toast("Recording too short or empty — try again", "error");
          statusEl.textContent = "Click to start recording";
          return;
        }
        const fd = new FormData();
        fd.append("audio", blob, `recording.${ext}`);
        try {
          const res = await fetch("/api/record", { method: "POST", body: fd });
          const data = await res.json();
          if (data.job_id) {
            addJob({
              id: data.job_id,
              filename: `recording.${ext}`,
              status: "queued",
              progress: 0,
            });
            watchJob(data.job_id);
            selectJob(data.job_id);
            toast("Recording submitted");
          } else {
            toast(`Server error: ${data.error}`, "error");
          }
        } catch (e) {
          toast(`Upload failed: ${e.message}`, "error");
        }
        statusEl.textContent = "Click to start recording";
      }

      function updateTimer() {
        const s = Math.floor((Date.now() - recordStart) / 1000);
        timerEl.textContent = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
      }

      function drawWaveform() {
        animFrame = requestAnimationFrame(drawWaveform);
        const data = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteTimeDomainData(data);
        const W = waveformCanvas.offsetWidth,
          H = waveformCanvas.offsetHeight;
        waveformCanvas.width = W;
        waveformCanvas.height = H;
        ctx2d.clearRect(0, 0, W, H);
        ctx2d.strokeStyle = "#c4a882";
        ctx2d.lineWidth = 1.5;
        ctx2d.beginPath();
        const step = W / data.length;
        for (let i = 0; i < data.length; i++) {
          const y = (data[i] / 128.0) * (H / 2);
          i === 0 ? ctx2d.moveTo(i * step, y) : ctx2d.lineTo(i * step, y);
        }
        ctx2d.stroke();
      }

      // ─── File Upload ──────────────────────────────────────────────────────────────
      fileInput.addEventListener("change", (e) => {
        if (e.target.files[0]) uploadFile(e.target.files[0]);
      });
      uploadZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        uploadZone.classList.add("drag-over");
      });
      uploadZone.addEventListener("dragleave", () =>
        uploadZone.classList.remove("drag-over"),
      );
      uploadZone.addEventListener("drop", (e) => {
        e.preventDefault();
        uploadZone.classList.remove("drag-over");
        if (e.dataTransfer.files[0]) uploadFile(e.dataTransfer.files[0]);
      });

      async function uploadFile(file) {
        const fd = new FormData();
        fd.append("file", file);
        toast(`Uploading ${file.name}…`);
        try {
          const res = await fetch("/api/upload", { method: "POST", body: fd });
          const data = await res.json();
          if (data.error) {
            toast(data.error, "error");
            return;
          }
          addJob({
            id: data.job_id,
            filename: file.name,
            status: "queued",
            progress: 0,
          });
          watchJob(data.job_id);
          toast("File uploaded — transcribing…", "success");
        } catch (e) {
          toast("Upload failed", "error");
        }
      }

      // ─── Jobs ─────────────────────────────────────────────────────────────────────
      let jobElements = {};

      function addJob(job) {
        const el = document.createElement("div");
        el.className = "job-item";
        el.dataset.id = job.id;
        const hasRecording = !!job.recording;
        el.innerHTML = `
          <div class="job-name">${job.filename}</div>
          <div class="job-meta">
            <span class="job-status status-${job.status}">${job.status}</span>
            ${hasRecording ? `<a class="job-download" href="/api/jobs/${job.id}/download" title="Download" download>⬇</a>` : ""}
            <button class="job-delete" title="Delete" data-id="${job.id}">✕</button>
          </div>
          <div class="job-progress" style="width:${job.progress || 0}%"></div>`;
        el.querySelector(".job-delete").addEventListener("click", (e) => {
          e.stopPropagation();
          deleteJob(job.id);
        });
        if (hasRecording)
          el.querySelector(".job-download").addEventListener("click", (e) =>
            e.stopPropagation(),
          );
        el.addEventListener("click", () => selectJob(job.id));
        jobsList.prepend(el);
        jobElements[job.id] = el;
      }

      function updateJobEl(job) {
        const el = jobElements[job.id];
        if (!el) return;
        el.querySelector(".job-status").className =
          `job-status status-${job.status}`;
        el.querySelector(".job-status").textContent = job.status;
        el.querySelector(".job-progress").style.width =
          (job.progress || 0) + "%";
        if (job.status === "done")
          el.querySelector(".job-progress").style.background = "var(--green)";
        if (job.status === "error")
          el.querySelector(".job-progress").style.background = "var(--red)";
      }

      function selectJob(id) {
        document
          .querySelectorAll(".job-item")
          .forEach((e) => e.classList.remove("active"));
        if (jobElements[id]) jobElements[id].classList.add("active");
        activeJobId = id;
        fetch(`/api/status/${id}`)
          .then((r) => r.json())
          .then((job) => {
            if (job.status === "done" && job.transcript) {
              showTranscript(job.transcript, job.ai_results);
            } else if (job.status === "error") {
              toast(`Error: ${job.error}`, "error");
            } else {
              showProcessing(job.status);
            }
          });
      }

      async function deleteJob(id) {
        await fetch(`/api/jobs/${id}`, { method: "DELETE" });
        const el = jobElements[id];
        if (el) el.remove();
        delete jobElements[id];
        if (activeJobId === id) {
          activeJobId = null;
          editor.style.display = "none";
          emptyState.style.display = "flex";
          setEditorButtons(false);
          charCount.textContent = "";
          renderAiResults([]);
        }
      }

      function watchJob(id) {
        if (!jobStartTime[id]) jobStartTime[id] = Date.now();
        if (!lastUpdateTime[id]) lastUpdateTime[id] = Date.now();
        if (activeJobId === id) startElapsedTimer(id);

        const poll = setInterval(async () => {
          const res = await fetch(`/api/status/${id}`);
          const job = await res.json();
          updateJobEl(job);
          if (job.progress !== lastProgress[id]) {
            lastProgress[id] = job.progress;
            lastUpdateTime[id] = Date.now();
          }
          if (job.status === "done" || job.status === "error") {
            clearInterval(poll);
            stopElapsedTimer();
            delete jobStartTime[id];
            delete lastUpdateTime[id];
            delete lastProgress[id];
            if (job.status === "done") {
              toast("Transcription complete!", "success");
              if (activeJobId === id || !activeJobId) {
                showTranscript(job.transcript, job.ai_results);
                selectJob(id);
              }
            } else {
              toast(`Job failed: ${job.error}`, "error");
              if (activeJobId === id) hideProcessing();
            }
          } else {
            if (activeJobId === id) updateProgressUI(job.status, job.progress);
          }
        }, 1500);
      }

      // ─── Editor ───────────────────────────────────────────────────────────────────
      function showTranscript(text, aiResults) {
        emptyState.style.display = "none";
        processingOverlay.classList.remove("active");
        editor.style.display = "block";
        editor.value = text;
        updateCharCount();
        setEditorButtons(true);
        renderAiResults(aiResults || []);
      }

      function showProcessing(label, pct) {
        emptyState.style.display = "none";
        processingOverlay.classList.add("active");
        editor.style.display = "none";
        renderAiResults([]);
        setEditorButtons(false);
        updateProgressUI(label, pct || 0);
      }

      function updateProgressUI(label, pct) {
        const stageMap = {
          queued: "Queued…",
          converting: "Converting to audio…",
          transcribing: "Transcribing…",
        };
        processingLabel.textContent = stageMap[label] || label + "…";
        document.getElementById("progress-bar-fill").style.width = pct + "%";
        document.getElementById("progress-pct").textContent =
          pct > 0 ? pct + "%" : "";
      }

      function startElapsedTimer(jobId) {
        clearInterval(elapsedInterval);
        elapsedInterval = setInterval(() => {
          const start = jobStartTime[jobId];
          if (!start) return;
          const elapsed = Math.floor((Date.now() - start) / 1000);
          const m = String(Math.floor(elapsed / 60)).padStart(2, "0");
          const s = String(elapsed % 60).padStart(2, "0");
          document.getElementById("progress-elapsed").textContent = `${m}:${s}`;
          const lastUpd = lastUpdateTime[jobId];
          if (lastUpd) {
            const stale = Math.floor((Date.now() - lastUpd) / 1000);
            const el = document.getElementById("progress-last-update");
            if (stale > 10) {
              el.textContent = `last update ${stale}s ago`;
              el.style.color = stale > 30 ? "var(--red)" : "var(--muted)";
            } else {
              el.textContent = "";
            }
          }
        }, 1000);
      }

      function stopElapsedTimer() {
        clearInterval(elapsedInterval);
        document.getElementById("progress-elapsed").textContent = "";
        document.getElementById("progress-last-update").textContent = "";
        document.getElementById("progress-pct").textContent = "";
        document.getElementById("progress-bar-fill").style.width = "0%";
      }

      function hideProcessing() {
        processingOverlay.classList.remove("active");
      }

      function setEditorButtons(on) {
        btnSummarize.disabled = !on;
        btnGrammar.disabled = !on;
        btnCopy.disabled = !on;
        btnExport.disabled = !on;
      }

      editor.addEventListener("input", updateCharCount);
      function updateCharCount() {
        const n = editor.value.length;
        charCount.textContent = n > 0 ? `${n.toLocaleString()} chars` : "";
      }

      // ─── Toolbar ──────────────────────────────────────────────────────────────────
      btnCopy.addEventListener("click", () => {
        navigator.clipboard
          .writeText(editor.value)
          .then(() => toast("Copied!", "success"));
      });

      btnExport.addEventListener("click", () => {
        const blob = new Blob([`# Transcript\n\n${editor.value}\n`], {
          type: "text/markdown",
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "transcript.md";
        a.click();
        URL.revokeObjectURL(url);
        toast("Exported as Markdown", "success");
      });

      // ─── AI Results ───────────────────────────────────────────────────────────────
      function escHtml(str) {
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function renderAiResults(aiResults) {
        // Keep the panel container but clear dynamic blocks
        aiResultsPanel.innerHTML = "";

        if (!aiResults || aiResults.length === 0) {
          aiResultsPanel.innerHTML = `
            <div class="ai-empty-state">
              <div class="ai-empty-glyph">✦</div>
              <div class="ai-empty-text">Summarize or auto-fix your transcript to see results here</div>
            </div>`;
          return;
        }

        // Sort: grammar fixes first, then summaries — newest on top within each group
        const sorted = [...aiResults]
          .map((r, idx) => ({ ...r, originalIdx: idx }))
          .sort((a, b) => {
            if (a.mode === b.mode) return b.created_at - a.created_at;
            return a.mode === "grammar" ? -1 : 1;
          });

        sorted.forEach((r) => {
          const idx = r.originalIdx;
          const label = r.mode === "summarize" ? "⚡ Summary" : "✦ Grammar Fix";
          const badgeCls =
            r.mode === "summarize" ? "badge-summarize" : "badge-grammar";
          const timeStr = new Date(r.created_at * 1000).toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit",
          });
          const block = document.createElement("div");
          block.className = "ai-result-block";

          block.innerHTML = `
              <div class="ai-result-header">
                <span class="ai-result-badge ${badgeCls}">${label}</span>
                <span class="ai-result-time">${timeStr}</span>
                <button class="ai-result-delete" title="Delete">✕</button>
              </div>
              <div class="ai-result-body">${escHtml(r.text)}</div>
              <div class="ai-result-progress">
                <div class="ai-result-progress-fill" style="width: ${r.progress || 0}%"></div>
              </div>
              <div class="ai-result-actions">
                <button class="btn btn-ghost ai-copy-btn">⎘ Copy</button>
                <button class="btn btn-ghost ai-export-btn">↓ Export .md</button>
              </div>`;

          block
            .querySelector(".ai-result-header")
            .addEventListener("click", (e) => {
              if (e.target.classList.contains("ai-result-delete")) return;
              block
                .querySelector(".ai-result-body")
                .classList.toggle("collapsed");
              block
                .querySelector(".ai-result-actions")
                .classList.toggle("collapsed");
            });

          block.querySelector(".ai-copy-btn").addEventListener("click", () => {
            navigator.clipboard
              .writeText(r.text)
              .then(() => toast("Copied!", "success"));
          });

          block
            .querySelector(".ai-export-btn")
            .addEventListener("click", () => {
              const lbl = r.mode === "summarize" ? "Summary" : "Grammar-Fix";
              const blob = new Blob([`# ${lbl}\n\n${r.text}\n`], {
                type: "text/markdown",
              });
              const url = URL.createObjectURL(blob);
              const a = document.createElement("a");
              a.href = url;
              a.download = `${lbl.toLowerCase()}.md`;
              a.click();
              URL.revokeObjectURL(url);
              toast(`Exported ${lbl}`, "success");
            });

          block
            .querySelector(".ai-result-delete")
            .addEventListener("click", async (e) => {
              e.stopPropagation();
              if (!activeJobId) return;
              const res = await fetch(`/api/jobs/${activeJobId}/ai/${idx}`, {
                method: "DELETE",
              });
              if (res.ok) {
                const data = await res.json();
                renderAiResults(data.ai_results);
                toast("Deleted", "success");
              }
            });

          aiResultsPanel.appendChild(block);
        });
      }

      async function aiAction(mode) {
        const text = editor.value;
        if (!text.trim()) return;
        const btn = mode === "summarize" ? btnSummarize : btnGrammar;
        const origText = btn.textContent;
        btn.disabled = true;
        btn.textContent = "…";
        try {
          const res = await fetch("/api/ai", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text, mode, job_id: activeJobId }),
          });
          const data = await res.json();
          if (data.error) {
            toast(data.hint || data.detail || data.error, "error");
          } else {
            if (activeJobId) {
              const jobRes = await fetch(`/api/status/${activeJobId}`);
              const job = await jobRes.json();
              renderAiResults(job.ai_results || []);
            }
            toast(
              `${mode === "summarize" ? "Summary" : "Grammar fix"} saved`,
              "success",
            );
          }
        } catch (e) {
          toast(`AI request failed: ${e.message}`, "error");
        } finally {
          btn.disabled = false;
          btn.textContent = origText;
          btnSummarize.disabled = false;
          btnGrammar.disabled = false;
        }
      }

      btnSummarize.addEventListener("click", () => aiAction("summarize"));
      btnGrammar.addEventListener("click", () => aiAction("grammar"));

      // ─── Init ─────────────────────────────────────────────────────────────────────
      (async function init() {
        try {
          const res = await fetch("/api/jobs");
          const list = await res.json();
          [...list].reverse().forEach((job) => {
            addJob(job);
            if (job.status !== "done" && job.status !== "error")
              watchJob(job.id);
          });
          const done = list.find((j) => j.status === "done");
          if (done) selectJob(done.id);
        } catch (e) {
          /* server not ready */
        }
      })();
      function updateAiProgress(idx, pct) {
        const block = aiResultsPanel.querySelectorAll(".ai-result-block")[idx];
        if (!block) return;
        const fill = block.querySelector(".ai-result-progress-fill");
        if (fill) fill.style.width = (pct || 0) + "%";
      }

      // Optional: call this after renderAiResults to initialize/update
      function refreshAiProgress(job) {
        job.ai_results?.forEach((r, idx) => updateAiProgress(idx, r.progress));
      }
    </script>
  </body>
</html>
