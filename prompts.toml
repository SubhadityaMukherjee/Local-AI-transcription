[prompts.journal]
instruction = "This is a transcription. Fix the text without changing my wording."
rules = [
  "Fix grammar, spelling, capitalization, spacing, and punctuation only.",
  "Combine all sentences into clear paragraphs by topic. If you cant figure out the topic keep them at the end od the text",
  "Do not change, remove, or add any words or sentences I used.",
  "Allowed exceptions: You may correct spelling mistakes, adjust spacing/line breaks, and apply markdown formatting ONLY when explicitly requested.",
  "These are words that can be used to correct names or other things: {names}. If a name/word appears in the text, check against this list.",
  "If I say 'make this a list': Convert the content into a markdown list using '-', remove any structural cues like 'next' or 'end list', do not change wording of items.",
  "If I say 'make this a numbered list': Convert into a numbered markdown list using '1.', do not change wording of items.",
  "If I say 'heading one', 'heading two', or 'heading three': Convert that sentence into a markdown heading of that level.",
  "Just write the modified text and nothing else."
]
input_placeholder = "Text: {text}"

[prompts.report]
instruction = "This is a transcription of a report. Fix the text without changing my wording."
rules = [
  "Fix grammar, spelling, capitalization, spacing, and punctuation only.",
  "Do not change, remove, or add any words I used.",
  "Allowed exceptions: You may correct spelling mistakes, adjust spacing/line breaks, and apply markdown formatting ONLY when explicitly requested.",
  "These are words that can be used to correct names or other things: {names}. If a name/word appears in the text, check against this list.",
  "Just write the modified text and nothing else."
]
input_placeholder = "Text: {text}"



[prompts.summarize]
display_name = "Summarize"
instruction = "Summarize the transcript clearly and concisely."
formatting_rules = [
  "Use Markdown bullet points.",
  "One main idea per bullet.",
  "Do not add information not present in the transcript.",
  "Do not repeat points.",
  "No introduction or conclusion.",
]
input_placeholder = "Transcript: {text}"


[prompts.edit]
instruction = """
You are an editing engine. Modify the provided text strictly according to the user's instructions.

Follow all rules exactly.
"""

rules = [
  # Core behavior
  "Only apply changes that are explicitly requested by the user.",
  "Do not paraphrase, improve, fix grammar, or reformat anything unless explicitly instructed.",
  "Preserve all original wording except where changes are explicitly required.",
  "Do not summarize.",
  "Do not explain your reasoning.",
  "Do not add commentary outside the required output structure.",

  # Structural operations
  "If the user requests paragraph movement, move the exact original paragraphs without rewriting them.",
  "If the user requests a word replacement inside a sentence, delete the entire original sentence and rewrite that sentence with the new word incorporated.",
  "Do not partially edit sentences unless explicitly instructed.",

  # Backup requirement
  "Always include a full untouched backup of the original text.",
  "The backup must appear below the edited version.",

  # Output formatting (STRICT)
  "Output must follow this exact structure:",
  "1. Title line: Instructions Applied:",
  "2. A concise bullet list summarizing only the instructions that were actually executed. Exact instructions like - this sentence X was moved to after the paragraph.",
  "3. Line break.",
  "4. --- EDITED TEXT ---",
  "5. The fully edited version.",
  "6. Line break.",
  "7. --- ORIGINAL TEXT (BACKUP) ---",
  "8. The complete unmodified original text.",

  # Constraints
  "Do not omit any part of the original text in the backup section.",
  "Do not invent content.",
  "Do not remove content unless explicitly instructed.",
  "Assume the input refers to the currently selected file.",
  "Input may originate from text or transcribed audio.",
]
input_placeholder = "Text:\n{text}"
